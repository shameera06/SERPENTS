<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Food Type - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/food-types}">Food Types</a></li>
                    <li class="breadcrumb-item active">Edit Food Type</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Food Type: <span class="text-primary" th:text="${foodType.name}"></span></h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/food-types/{id}(id=${foodType.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label fw-semibold">Name *</label>
                                <input type="text" id="name" name="name" class="form-control" th:value="${foodType.name}" required autofocus />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="parentId" class="form-label fw-semibold">Parent Category</label>
                                <select id="parentId" name="parentId" class="form-select">
                                    <option value="">None (Top-Level Category)</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${foodType.parent != null and foodType.parent.id == cat.id}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" name="description" rows="3" class="form-control" th:text="${foodType.description}"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label fw-semibold">Status</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="true" th:selected="${foodType.status}">Active</option>
                                    <option value="false" th:selected="${!foodType.status}">Inactive</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="defaultUnit" class="form-label fw-semibold">Default Feeding Unit</label>
                                <select id="defaultUnit" name="defaultUnit" class="form-select">
                                    <option value="piece" th:selected="${foodType.defaultUnit == 'piece'}">Piece / Count</option>
                                    <option value="gram" th:selected="${foodType.defaultUnit == 'gram'}">Grams (g)</option>
                                    <option value="kg" th:selected="${foodType.defaultUnit == 'kg'}">Kilograms (kg)</option>
                                    <option value="serving" th:selected="${foodType.defaultUnit == 'serving'}">Serving</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Food Type</button>
                            <a th:href="@{/admin/food-types}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
