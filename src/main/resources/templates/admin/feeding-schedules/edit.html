<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Feeding Schedule - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/feeding-schedules}">Feeding Schedules</a></li>
                    <li class="breadcrumb-item active">Edit Schedule</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Feeding Schedule: <span class="text-primary" th:text="${schedule.reptile != null ? schedule.reptile.name : ''}"></span></h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/feeding-schedules/{id}(id=${schedule.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reptileId" class="form-label fw-semibold">Reptile *</label>
                                <select id="reptileId" name="reptileId" class="form-select" required>
                                    <option th:each="r : ${reptiles}" th:value="${r.id}" th:text="${r.name + ' (' + r.reptileCode + ')'}" th:selected="${schedule.reptile != null and schedule.reptile.id == r.id}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="foodTypeId" class="form-label fw-semibold">Food Type *</label>
                                <select id="foodTypeId" name="foodTypeId" class="form-select" required>
                                    <option th:each="f : ${foodTypes}" th:value="${f.id}" th:text="${f.name}" th:selected="${schedule.foodType != null and schedule.foodType.id == f.id}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="quantity" class="form-label fw-semibold">Quantity *</label>
                                <input type="number" step="0.1" min="0.1" id="quantity" name="quantity" class="form-control" th:value="${schedule.quantity}" required />
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="quantityUnit" class="form-label fw-semibold">Quantity Unit *</label>
                                <select id="quantityUnit" name="quantityUnit" class="form-select" required>
                                    <option value="piece" th:selected="${schedule.quantityUnit == 'piece'}">Piece / Count</option>
                                    <option value="gram" th:selected="${schedule.quantityUnit == 'gram'}">Grams (g)</option>
                                    <option value="kg" th:selected="${schedule.quantityUnit == 'kg'}">Kilograms (kg)</option>
                                    <option value="serving" th:selected="${schedule.quantityUnit == 'serving'}">Serving</option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="intervalDays" class="form-label fw-semibold">Interval (Days) *</label>
                                <input type="number" min="1" id="intervalDays" name="intervalDays" class="form-control" th:value="${schedule.intervalDays}" required />
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="status" class="form-label fw-semibold">Status *</label>
                                <select id="status" name="status" class="form-select" required>
                                    <option value="active" th:selected="${schedule.status == 'active'}">Active</option>
                                    <option value="paused" th:selected="${schedule.status == 'paused'}">Paused</option>
                                    <option value="completed" th:selected="${schedule.status == 'completed'}">Completed</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label fw-semibold">Instructions / Notes</label>
                            <textarea id="notes" name="notes" rows="3" class="form-control" th:text="${schedule.notes}"></textarea>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Schedule</button>
                            <a th:href="@{/admin/feeding-schedules}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
