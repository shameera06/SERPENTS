<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="snakeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10b981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield / Emblem Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadowGlow)"/>
  
  <!-- Subtle Internal Ring Grid -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.45"/>

  <!-- Stylized Coiled Serpent Body (Continuous Dynamic Curve) -->
  <!-- Tail coil lower base -->
  <path d="M 60,98 C 42,98 32,88 32,77 C 32,65 42,58 56,56 C 70,54 78,48 78,39 C 78,28 69,21 58,21 C 48,21 41,27 39,34 C 38,37 34,39 30,38 C 27,36 26,32 28,27 C 33,16 44,9 58,9 C 77,9 90,20 90,37 C 90,52 78,62 61,65 C 49,67 44,72 44,78 C 44,83 49,87 60,87 C 72,87 81,81 85,74 C 87,70 91,69 95,71 C 98,73 99,78 96,82 C 89,92 76,98 60,98 Z" 
        fill="url(#snakeBodyGrad)" />

  <!-- Serpent Head & Hood -->
  <path d="M 58,9 C 64,9 70,13 72,19 C 73,23 71,28 66,30 C 60,32 55,29 53,24 C 52,20 54,14 58,9 Z" 
        fill="url(#goldGrad)"/>

  <!-- Cobra Hood Flanges -->
  <path d="M 49,20 C 44,24 43,30 46,35 C 50,32 53,27 54,23 Z" fill="#34d399" opacity="0.85"/>
  <path d="M 69,19 C 74,23 76,29 73,34 C 70,31 68,26 67,22 Z" fill="#34d399" opacity="0.85"/>

  <!-- Fierce Serpent Ruby / Amber Eye -->
  <ellipse cx="65" cy="18" rx="2.5" ry="3.5" fill="#ef4444" stroke="#fef08a" stroke-width="0.8"/>
  <circle cx="65.5" cy="17.5" r="0.8" fill="#ffffff"/>

  <!-- Crown Scales / Dorsal Gold Accents -->
  <path d="M 57,41 Q 61,45 65,41 Q 61,37 57,41 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 52,50 Q 56,54 60,50 Q 56,46 52,50 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 43,62 Q 47,66 51,62 Q 47,58 43,62 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 46,73 Q 50,77 54,73 Q 50,69 46,73 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 58,80 Q 62,84 66,80 Q 62,76 58,80 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Forked Tongue Flick -->
  <path d="M 72,18 Q 78,17 83,14 M 78,17 Q 83,20 85,22" 
        fill="none" stroke="#f43f5e" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Modern Star Highlight -->
  <polygon points="60,3 62,7 66,7 63,10 64,14 60,11 56,14 57,10 54,7 58,7" fill="#fde047" opacity="0.9"/>
</svg>
