<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Poop Record - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/poop-records}">Defecation Records</a></li>
                    <li class="breadcrumb-item active">Edit Record</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Defecation Record</h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/poop-records/{id}(id=${record.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reptileId" class="form-label fw-semibold">Snake / Reptile *</label>
                                <select id="reptileId" name="reptileId" class="form-select" required>
                                    <option th:each="r : ${reptiles}" th:value="${r.id}" th:text="${r.name + ' (' + r.reptileCode + ')'}" th:selected="${record.reptile != null and record.reptile.id == r.id}"></option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="poopDate" class="form-label fw-semibold">Defecation Date & Time *</label>
                                <input type="datetime-local" id="poopDate" name="poopDate" class="form-control" th:value="${#temporals.format(record.poopDate, 'yyyy-MM-dd''T''HH:mm')}" required />
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="weightAfterPoop" class="form-label fw-semibold">Weight After Poop (g)</label>
                                <input type="number" step="0.1" min="0" id="weightAfterPoop" name="weightAfterPoop" class="form-control" th:value="${record.weightAfterPoop}" placeholder="e.g. 350.0" />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="consistency" class="form-label fw-semibold">Stool Consistency *</label>
                                <select id="consistency" name="consistency" class="form-select" required>
                                    <option value="normal" th:selected="${record.consistency == 'normal'}">Normal (Formed)</option>
                                    <option value="loose" th:selected="${record.consistency == 'loose'}">Loose / Diarrhea</option>
                                    <option value="hard" th:selected="${record.consistency == 'hard'}">Hard / Constipated</option>
                                    <option value="mucus" th:selected="${record.consistency == 'mucus'}">Mucus Present</option>
                                    <option value="bloody" th:selected="${record.consistency == 'bloody'}">Bloody</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="uratesStatus" class="form-label fw-semibold">Urates Appearance *</label>
                                <select id="uratesStatus" name="uratesStatus" class="form-select" required>
                                    <option value="normal_white" th:selected="${record.uratesStatus == 'normal_white'}">Normal Chalky White</option>
                                    <option value="yellowish" th:selected="${record.uratesStatus == 'yellowish'}">Yellowish (Mild Dehydration)</option>
                                    <option value="greenish" th:selected="${record.uratesStatus == 'greenish'}">Greenish (Severe Dehydration / Infection)</option>
                                    <option value="none" th:selected="${record.uratesStatus == 'none'}">No Urates Passed</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="observations" class="form-label fw-semibold">Clinical Observations</label>
                            <textarea id="observations" name="observations" rows="2" class="form-control" th:text="${record.observations}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label fw-semibold">Husbandry Notes</label>
                            <textarea id="notes" name="notes" rows="2" class="form-control" th:text="${record.notes}"></textarea>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Defecation Record</button>
                            <a th:href="@{/admin/poop-records}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
