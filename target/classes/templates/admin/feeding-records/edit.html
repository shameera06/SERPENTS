<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Feeding Record - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/feeding-records}">Feeding Records</a></li>
                    <li class="breadcrumb-item active">Edit Record</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Feeding Record</h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/feeding-records/{id}(id=${record.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reptileId" class="form-label fw-semibold">Reptile *</label>
                                <select id="reptileId" name="reptileId" class="form-select" required>
                                    <option th:each="r : ${reptiles}" th:value="${r.id}" th:text="${r.name + ' (' + r.reptileCode + ')'}" th:selected="${record.reptile != null and record.reptile.id == r.id}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="feedingScheduleId" class="form-label fw-semibold">Linked Feeding Schedule (Optional)</label>
                                <select id="feedingScheduleId" name="feedingScheduleId" class="form-select">
                                    <option value="">None (Unscheduled Ad-Hoc Feeding)</option>
                                    <option th:each="s : ${schedules}" th:value="${s.id}" th:text="${'Schedule #' + s.id + ' - ' + s.reptile.name + ' (' + s.foodType.name + ')'}" th:selected="${record.feedingSchedule != null and record.feedingSchedule.id == s.id}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="foodTypeId" class="form-label fw-semibold">Food Type *</label>
                                <select id="foodTypeId" name="foodTypeId" class="form-select" required>
                                    <option th:each="f : ${foodTypes}" th:value="${f.id}" th:text="${f.name}" th:selected="${record.foodType != null and record.foodType.id == f.id}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="feedingDate" class="form-label fw-semibold">Feeding Date & Time *</label>
                                <input type="datetime-local" id="feedingDate" name="feedingDate" class="form-control" th:value="${#temporals.format(record.feedingDate, 'yyyy-MM-dd''T''HH:mm')}" required />
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label fw-semibold">Quantity *</label>
                                <input type="number" step="0.1" min="0.1" id="quantity" name="quantity" class="form-control" th:value="${record.quantity}" required />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="quantityUnit" class="form-label fw-semibold">Quantity Unit *</label>
                                <select id="quantityUnit" name="quantityUnit" class="form-select" required>
                                    <option value="piece" th:selected="${record.quantityUnit == 'piece'}">Piece / Count</option>
                                    <option value="gram" th:selected="${record.quantityUnit == 'gram'}">Grams (g)</option>
                                    <option value="kg" th:selected="${record.quantityUnit == 'kg'}">Kilograms (kg)</option>
                                    <option value="serving" th:selected="${record.quantityUnit == 'serving'}">Serving</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="weightBefore" class="form-label fw-semibold">Weight Before (g) *</label>
                                <input type="number" step="0.1" min="0" id="weightBefore" name="weightBefore" class="form-control" th:value="${record.weightBefore}" required />
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="weightAfter" class="form-label fw-semibold">Weight After (g) *</label>
                                <input type="number" step="0.1" min="0" id="weightAfter" name="weightAfter" class="form-control" th:value="${record.weightAfter}" required />
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="weightAfterDefecation" class="form-label fw-semibold">Weight After Defecation (g)</label>
                                <input type="number" step="0.1" min="0" id="weightAfterDefecation" name="weightAfterDefecation" class="form-control" th:value="${record.weightAfterDefecation}" />
                                <small class="text-muted">Post-poop weight for accurate net growth analysis.</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label fw-semibold">Clinical Observations / Notes</label>
                            <textarea id="notes" name="notes" rows="3" class="form-control" th:text="${record.notes}"></textarea>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Feeding Record</button>
                            <a th:href="@{/admin/feeding-records}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
