<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shedding Record - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/shedding-records}">Shedding Records</a></li>
                    <li class="breadcrumb-item active">Edit Shedding Record</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Shedding Record</h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/shedding-records/{id}(id=${record.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reptileId" class="form-label fw-semibold">Reptile *</label>
                                <select id="reptileId" name="reptileId" class="form-select" required>
                                    <option th:each="r : ${reptiles}" th:value="${r.id}" th:text="${r.name + ' (' + r.reptileCode + ')'}" th:selected="${record.reptile != null and record.reptile.id == r.id}"></option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="sheddingDate" class="form-label fw-semibold">Shedding Date *</label>
                                <input type="date" id="sheddingDate" name="sheddingDate" class="form-control" th:value="${#temporals.format(record.sheddingDate, 'yyyy-MM-dd')}" required />
                            </div>

                            <div class="col-md-3 mb-3">
                                <label for="status" class="form-label fw-semibold">Status *</label>
                                <select id="status" name="status" class="form-select" required>
                                    <option value="complete" th:selected="${record.status == 'complete'}">Complete (One Piece / Good)</option>
                                    <option value="incomplete" th:selected="${record.status == 'incomplete'}">Incomplete (Dysecdysis / Retained)</option>
                                    <option value="stuck" th:selected="${record.status == 'stuck'}">Stuck (Eye caps / Tail tip)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="observations" class="form-label fw-semibold">Observations (e.g. skin quality, retained eye caps)</label>
                            <textarea id="observations" name="observations" rows="3" class="form-control" th:text="${record.observations}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label fw-semibold">Husbandry Notes</label>
                            <textarea id="notes" name="notes" rows="2" class="form-control" th:text="${record.notes}"></textarea>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Record</button>
                            <a th:href="@{/admin/shedding-records}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
