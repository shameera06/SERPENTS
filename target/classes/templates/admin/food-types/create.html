<!DOCTYPE html>
<html lang="en" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Food Type | SERPENTS Hub</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/img/favicon/favicon.ico}" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/core.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/theme-default.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
</head>

<body>
<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

        <!-- Sidebar Navigation -->
        <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
            <div class="app-brand demo">
                <a th:href="@{/admin/dashboard}" class="app-brand-link d-flex align-items-center">
                    <span class="app-brand-logo demo"><img th:src="@{/assets/img/serpents-logo.svg}" alt="SERPENTS" style="width: 32px; height: 32px; filter: drop-shadow(0 2px 5px rgba(16, 185, 129, 0.4));" /></span>
                    <span class="app-brand-text demo menu-text fw-bolder ms-2 text-uppercase text-white" style="letter-spacing: 1.5px; font-family: 'Outfit', sans-serif; font-size: 1.25rem;">SERPENTS</span>
                </a>
            </div>
            <ul class="menu-inner py-1">
                <li class="menu-header small text-uppercase"><span class="menu-header-text">Main</span></li>
                <li class="menu-item"><a th:href="@{/admin/dashboard}" class="menu-link"><i class="menu-icon tf-icons bx bx-home-circle"></i><div>Dashboard</div></a></li>
                <li class="menu-header small text-uppercase"><span class="menu-header-text">Reptile Management</span></li>
                <li class="menu-item"><a th:href="@{/admin/species/directory}" class="menu-link"><i class="menu-icon tf-icons bx bx-spa"></i><div>Species &amp; Morphs</div></a></li>
                <li class="menu-item"><a th:href="@{/admin/reptiles}" class="menu-link"><i class="menu-icon tf-icons bx bx-id-card"></i><div>Reptiles Catalog</div></a></li>
                <li class="menu-item active"><a th:href="@{/admin/food-types}" class="menu-link"><i class="menu-icon tf-icons bx bx-food-menu"></i><div>Food Types</div></a></li>
                <li class="menu-header small text-uppercase"><span class="menu-header-text">Care &amp; Health</span></li>
                <li class="menu-item"><a th:href="@{/admin/medical-records}" class="menu-link"><i class="menu-icon tf-icons bx bx-plus-medical"></i><div>Medical Records</div></a></li>
                <li class="menu-item"><a th:href="@{/admin/health-alerts}" class="menu-link"><i class="menu-icon tf-icons bx bx-error-circle"></i><div>Health Alerts</div></a></li>
                <li class="menu-header small text-uppercase"><span class="menu-header-text">AI Diagnostics</span></li>
                <li class="menu-item"><a th:href="@{/admin/disease-predictions}" class="menu-link"><i class="menu-icon tf-icons bx bx-scan"></i><div>AI Disease Scans</div></a></li>
                </ul>
        </aside>

        <div class="layout-page">
            <nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme">
                <div class="navbar-nav-right d-flex align-items-center w-100">
                    <a th:href="@{/admin/food-types}" class="btn btn-outline-secondary btn-sm me-3">
                        <i class="bx bx-arrow-back me-1"></i> Back to Food Types
                    </a>
                    <h5 class="mb-0 fw-semibold text-primary"><i class="bx bx-plus-circle me-2"></i> Add Food Type</h5>
                </div>
            </nav>

            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card shadow-sm">
                                <div class="card-header bg-primary text-white">
                                    <h5 class="text-white mb-0">New Prey / Food Type Item</h5>
                                </div>
                                <div class="card-body p-4">
                                    <form th:action="@{/admin/food-types}" method="post">
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Name *</label>
                                            <input type="text" name="name" class="form-control" placeholder="e.g. Adult Mouse, Hopper, Pinky" required />
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Parent Category (Optional)</label>
                                            <select name="parentId" class="form-select">
                                                <option value="">-- None (Top Level Category) --</option>
                                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Default Unit</label>
                                            <input type="text" name="defaultUnit" class="form-control" value="piece" placeholder="piece or gram" />
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Description</label>
                                            <textarea name="description" class="form-control" rows="2" placeholder="Prey size, frozen/live notes..."></textarea>
                                        </div>
                                        <div class="mb-4 form-check">
                                            <input type="checkbox" name="status" class="form-check-input" id="statusCheck" checked value="true" />
                                            <label class="form-check-label" for="statusCheck">Active</label>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bx bx-save me-1"></i> Save Food Type
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/assets/vendor/libs/jquery/jquery.js}"></script>
<script th:src="@{/assets/vendor/js/bootstrap.js}"></script>
</body>
</html>
