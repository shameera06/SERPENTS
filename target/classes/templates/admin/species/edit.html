<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Species - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/species}">Species</a></li>
                    <li class="breadcrumb-item active">Edit Species</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Species: <span class="text-primary" th:text="${species.name}"></span></h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/species/{id}(id=${species.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="categoryId" class="form-label fw-semibold">Category</label>
                                <select id="categoryId" name="categoryId" class="form-select">
                                    <option value="">Uncategorized</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${species.category != null and species.category.id == cat.id}"></option>
                                </select>
                                <small class="text-muted d-block mt-1">Top-level Category (e.g. Snake, Lizard).</small>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label fw-semibold">Species Name *</label>
                                <input type="text" id="name" name="name" class="form-control" th:value="${species.name}" required autofocus />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="scientificName" class="form-label fw-semibold">Scientific Name</label>
                                <input type="text" id="scientificName" name="scientificName" class="form-control" th:value="${species.scientificName}" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" name="description" rows="4" class="form-control" th:text="${species.description}"></textarea>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select id="status" name="status" class="form-select">
                                <option value="true" th:selected="${species.status}">Active</option>
                                <option value="false" th:selected="${!species.status}">Inactive</option>
                            </select>
                        </div>

                        <div>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Species</button>
                            <a th:href="@{/admin/species}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
