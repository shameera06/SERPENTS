<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medical Record - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/medical-records}">Medical Records</a></li>
                    <li class="breadcrumb-item active">Edit Record</li>
                </ol>
            </nav>

            <h4 class="fw-bold mb-4">Edit Veterinary / Medical Record</h4>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:action="@{/admin/medical-records/{id}(id=${record.id})}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reptileId" class="form-label fw-semibold">Reptile *</label>
                                <select id="reptileId" name="reptileId" class="form-select" required>
                                    <option th:each="r : ${reptiles}" th:value="${r.id}" th:text="${r.name + ' (' + r.reptileCode + ')'}" th:selected="${record.reptile != null and record.reptile.id == r.id}"></option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="treatmentDate" class="form-label fw-semibold">Treatment Date *</label>
                                <input type="date" id="treatmentDate" name="treatmentDate" class="form-control" th:value="${#temporals.format(record.treatmentDate, 'yyyy-MM-dd')}" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="symptomsOrCondition" class="form-label fw-semibold">Symptoms / Health Condition *</label>
                            <textarea id="symptomsOrCondition" name="symptomsOrCondition" rows="2" class="form-control" th:text="${record.symptomsOrCondition}" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="medicineName" class="form-label fw-semibold">Medicine Name</label>
                                <input type="text" id="medicineName" name="medicineName" class="form-control" th:value="${record.medicineName}" />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="dosage" class="form-label fw-semibold">Dosage / Administration</label>
                                <input type="text" id="dosage" name="dosage" class="form-control" th:value="${record.dosage}" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="treatmentDetails" class="form-label fw-semibold">Clinical Treatment Details</label>
                            <textarea id="treatmentDetails" name="treatmentDetails" rows="3" class="form-control" th:text="${record.treatmentDetails}"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="veterinarianName" class="form-label fw-semibold">Veterinarian Name</label>
                                <input type="text" id="veterinarianName" name="veterinarianName" class="form-control" th:value="${record.veterinarianName}" />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="veterinarianContact" class="form-label fw-semibold">Veterinarian Contact</label>
                                <input type="text" id="veterinarianContact" name="veterinarianContact" class="form-control" th:value="${record.veterinarianContact}" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notes" class="form-label fw-semibold">Internal Notes</label>
                            <textarea id="notes" name="notes" rows="2" class="form-control" th:text="${record.notes}"></textarea>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i> Update Medical Record</button>
                            <a th:href="@{/admin/medical-records}" class="btn btn-outline-secondary ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
