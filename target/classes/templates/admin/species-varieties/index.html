<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Species Varieties - SERPENTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin-custom.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
</head>
<body>
<div class="d-flex" id="wrapper">
    <div th:replace="~{admin/layouts/master :: sidebar}"></div>
    <div id="page-content-wrapper" class="w-100">
        <div th:replace="~{admin/layouts/master :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Species Varieties / Morphs</h4>
                    <p class="text-muted mb-0">Browse and manage sub-species varieties and morph classifications.</p>
                </div>
                <div>
                    <a th:href="@{/admin/species-varieties/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Add Variety</a>
                    <a th:href="@{/admin/species/browse}" class="btn btn-outline-secondary ms-2"><i class="bi bi-diagram-3 me-1"></i> Tree View</a>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">#</th>
                                    <th>Variety Name</th>
                                    <th>Parent Species</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(varieties)}">
                                    <td colspan="6" class="text-center py-4 text-muted">No varieties found.</td>
                                </tr>
                                <tr th:each="v, stat : ${varieties}">
                                    <td class="ps-4" th:text="${stat.count}">1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <img th:src="@{${v.photo}}"
                                                 th:alt="${v.species != null ? v.species.name : 'Reptile'} + ' ' + ${v.name} + ' morph profile photo'"
                                                 class="rounded-circle border" style="width: 42px; height: 42px; object-fit: cover;" />
                                            <strong th:text="${v.name}">Albino</strong>
                                        </div>
                                    </td>
                                    <td th:text="${v.species != null ? v.species.name : '-'}">Ball Python</td>
                                    <td>
                                        <span th:if="${v.status}" class="badge bg-label-success text-success">Active</span>
                                        <span th:unless="${v.status}" class="badge bg-label-secondary text-secondary">Inactive</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/species-varieties/{id}/edit(id=${v.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil me-1"></i> Edit</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
